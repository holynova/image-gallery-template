name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static site
        run: npm run build
        env:
          DEPLOY_TARGET: github-pages
          PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          PUBLIC_UMAMI_SCRIPT_URL: https://cloud.umami.is/script.js
          PUBLIC_UMAMI_WEBSITE_ID: e01c9f78-4607-4e60-b01c-77c8190b12b4
          PUBLIC_UMAMI_DOMAINS: holynova.github.io,image-gallery-template.xiaosang.cc
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
